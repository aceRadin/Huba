name: Catálogo americano do Bits
on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *'
permissions:
  contents: read
concurrency:
  group: bits-us
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ${{ fromJSON(vars.HUBA_CATALOG_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/gerar-bits-us.mjs
      - name: Salvar catálogo sem alterar versões diárias existentes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dados/bits-us/
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar catálogo americano do Bits'
            git push
          fi
  deploy:
    needs: catalog
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/configure-pages@v5
      - name: Preparar site
        run: |
          node scripts/gerar-palavras.mjs
          mkdir -p "$RUNNER_TEMP/site"
          cp -R css dados jogos js index.html playlists.js "$RUNNER_TEMP/site/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
