name: Publicar Hubdle
on:
  workflow_dispatch:
  schedule:
    - cron: '17 15,21 * * *'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: huba-pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      - run: npm run test:browsers
  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache/restore@v4
        id: catalog-cache
        with:
          path: .cache
          key: hubdle-agenda-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: hubdle-agenda-v1-
      - uses: actions/configure-pages@v5
      - name: Preparar agenda de hoje e dos próximos dois dias
        env:
          HUBA_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node scripts/preparar-catalogos.mjs
      - uses: actions/cache/save@v4
        with:
          path: .cache
          key: ${{ steps.catalog-cache.outputs.cache-primary-key }}
      - name: Preparar site
        run: |
          node scripts/gerar-palavras.mjs
          mkdir -p "$RUNNER_TEMP/site"
          cp -R css dados jogos js index.html playlists.js favicon.svg social-card.png "$RUNNER_TEMP/site/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verificar site publicado
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verificar-publicacao.mjs "$SITE_URL"
