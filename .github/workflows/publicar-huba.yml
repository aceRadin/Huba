name: Publicar HUBA
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: huba-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Data do catálogo em São Paulo
        id: catalog-date
        run: |
          node --input-type=module -e "import {appendFileSync} from 'node:fs'; import {dayKey} from './scripts/gerar-bits-artistas.mjs'; appendFileSync(process.env.GITHUB_OUTPUT, 'date='+dayKey()+'\n')"
      - uses: actions/cache/restore@v4
        id: catalog-cache
        with:
          path: .cache/bits-artistas
          key: bits-artistas-v1-${{ steps.catalog-date.outputs.date }}-${{ hashFiles('jogos/bits/artistas.js', 'scripts/gerar-bits-artistas.mjs') }}
      - name: Preparar músicas do Bits
        env:
          HUBA_BITS_DATE: ${{ steps.catalog-date.outputs.date }}
        run: node scripts/gerar-bits-artistas.mjs
      - uses: actions/cache/save@v4
        if: steps.catalog-cache.outputs.cache-hit != 'true'
        with:
          path: .cache/bits-artistas
          key: ${{ steps.catalog-cache.outputs.cache-primary-key }}
      - uses: actions/configure-pages@v5
      - name: Preparar site
        run: |
          node scripts/gerar-palavras.mjs
          mkdir -p "$RUNNER_TEMP/site"
          cp -R css dados jogos js index.html playlists.js "$RUNNER_TEMP/site/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
