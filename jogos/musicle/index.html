<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<title>HUBA — Musical</title>
<link rel="stylesheet" href="../../css/style.css?v=4">
<link rel="stylesheet" href="musical-opcoes.css">
<link rel="stylesheet" href="../../css/cabecalhos.css?v=4">
<link rel="stylesheet" href="../../css/huds.css?v=2">
</head>
<body >
<main>
<section id="home">
  <div class="hub-top">
    <h1><button type="button" class="brand-back" id="toLanding" onclick="window.location.href='../../index.html'" title="Voltar à tela inicial" aria-label="Voltar à tela inicial">‹ HUBA</button></h1>
    <div class="daily-streak" aria-live="polite"><strong id="statDailyStreak">0</strong><span>dias de streak diário</span></div>
    <div class="top-tools">
      <div class="mini-tool" id="difficultyTool">
        <span class="tool-label">Dificuldade</span>
        <div class="difficulty" role="group" aria-label="Dificuldade do Musical">
          <button type="button" data-clip="1.5" id="clipHard">Desafiador</button>
          <button type="button" data-clip="7" id="clipCasual">Casual</button>
        </div>
      </div>
    </div>
  </div>

  <div class="hub-grid">
    <p class="note" id="dzStatus" role="status" aria-live="polite"></p>
    <p id="summary" class="huba-catalog-count" aria-live="polite">Aguardando gênero…</p><p id="setupErr" class="hidden"></p>

    <div class="hub-center">
      <div class="games-grid single-game-modes">
        <div class="game-column">
          <h2 data-mode-title>Diário</h2>
          <p class="note" data-mode-description data-daily-description="Desafio do dia">Desafio do dia</p>
          <div class="tiles" id="tilesDaily"></div>
        </div>
      </div>
    </div>
  </div>
</section>
<section id="play" class="hidden">
  <header class="musical-play-header">
    <button class="back" id="backBtn">Voltar</button>
    <div class="musical-play-heading">
      <h1 id="playTitle">Musical</h1>
      <p class="sub" id="playSub"></p>
    </div>
    <span class="musical-header-spacer" aria-hidden="true"></span>
  </header>

  <div class="panel">
    <div id="quiz">
      <div class="qhead"><span id="qcount"></span><div class="dots" id="dots" aria-hidden="true"></div></div>
      <div class="musical-audio-row">
        <div class="vol">
          <button id="muteBtn" aria-label="Silenciar" title="Silenciar">🔊</button>
          <input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume">
          <span id="volLabel">80%</span>
        </div>
        <div class="clip">
          <button class="primary" id="playBtn">Tocar trecho</button>
          <button id="replaceSong" class="hidden" type="button" title="Trocar somente a música que falhou">Sortear outra música</button>
          <div class="bar" aria-hidden="true"><i id="fill"></i></div>
        </div>
      </div>
      <p class="note" style="margin:0 0 12px" id="qhint">Qual música tocou?</p>
      <div class="opts" id="opts"></div>
      <div class="row hidden" id="nextRow">
        <button class="primary" id="nextBtn">Próxima</button>
      </div>
    </div>
    <div class="result hidden" id="result">
      <h3 id="resultTitle"></h3>
      <ul class="recap" id="recap"></ul>
      <div class="row">
        <button class="primary" id="backBtn2">Voltar</button>
        <button id="again" class="hidden">Nova rodada</button>
      </div>
    </div>
  </div>
  <p id="gameCatalogCount" class="huba-game-catalog-count" aria-live="polite">0 músicas carregadas</p>
</section>
</main>
<script src="../../js/comum.js?v=3" defer></script>
<script src="../../js/idioma.js?v=10" defer></script>
<script src="../../js/huds.js?v=1" defer></script>
<script src="../../playlists.js?v=10" defer></script>
<script src="../../js/deezer.js?v=6" defer></script>
<script src="../../dados/playlists/config.js" defer></script>
<script src="../../js/playlists-catalogo.js?v=1" defer></script>
<script src="musicle.js?v=16" defer></script>
<script src="../../js/apoio-config.js" defer></script>
<script src="../../js/apoio.js" defer></script>
</body>
</html>
